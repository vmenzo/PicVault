<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171b1f" />
    <link rel="icon" type="image/svg+xml" href="/picvault-mark.svg?v=5" />
    <title>PicVault</title>
    <script>
      // Apply the stored (or system) theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('picvault-theme');
        if (
          t === 'dark' ||
          (t !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
