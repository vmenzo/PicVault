# PicVault reverse proxy — nginx example.
# Install: cp ops/nginx.conf /etc/nginx/sites-available/picvault
#          ln -s /etc/nginx/sites-available/picvault /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
# TLS:     certbot --nginx -d img.example.com   (see README, "Reverse proxy (HTTPS)")
# Assumes PicVault listens on 127.0.0.1:7899 (the default APP_BIND_ADDRESS).

# Redirect plain HTTP to HTTPS (Certbot adds/keeps this block too).
server {
    listen 80;
    listen [::]:80;
    server_name img.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name img.example.com;

    # Certificates issued by Certbot (certbot --nginx manages these lines).
    ssl_certificate /etc/letsencrypt/live/img.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/img.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads can be large; allow 100M bodies (raise if you allow bigger files).
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:7899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # No proxy_set_header Connection / Upgrade: PicVault has no websockets.
        proxy_read_timeout 300s;
    }
}
